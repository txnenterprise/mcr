services:
  nginx:
    image: nginxproxy/nginx-proxy:latest
    container_name: mcr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./data/html:/usr/share/nginx/html
      - ./data/certs:/etc/nginx/certs
      - ./data/vhost.d:/etc/nginx/vhost.d
      - ./nginx/custom.conf:/etc/nginx/conf.d/custom.conf:ro
    networks:
      - mcr-network
    depends_on:
      - mcr-api

  acme-companion:
    image: nginxproxy/acme-companion:latest
    container_name: mcr-acme
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/acme:/etc/acme.sh
      - ./data/certs:/etc/nginx/certs
      - ./data/html:/usr/share/nginx/html
      - ./data/vhost.d:/etc/nginx/vhost.d
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - mcr-network
    depends_on:
      - nginx

  postgres:
    image: postgres:15
    container_name: mcr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-txn_mcr}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcr-network

  mcr-api:
    image: ${MCR_IMAGE:-ghcr.io/txnenterprise/mcr/mcr-api:latest}
    build:
      context: ./MCR.API
      dockerfile: Dockerfile
    container_name: mcr-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__TXNEnterpriseInsuranceQuoteContext=Host=postgres;Port=5432;Database=${POSTGRES_DB:-txn_mcr};Username=${POSTGRES_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      - JwtSettings__Secret=${JWT_SECRET}
      - SKIP_MIGRATIONS=${SKIP_MIGRATIONS:-false}
      - VIRTUAL_HOST=${API_DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${API_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/dataprotection-keys:/root/.aspnet/DataProtection-Keys
    networks:
      - mcr-network

volumes:
  postgres_data:

networks:
  mcr-network:
    driver: bridge
