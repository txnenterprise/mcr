server {
    listen 80;
    server_name mcr-homologacao.txnenterprise.com.br;

    # Mesmos ajustes do custom.conf do stack
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    client_max_body_size 50M;

    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    location / {
        proxy_pass http://mcr-api:80;
        proxy_set_header Host $host;
        # X-Forwarded-Proto / X-Forwarded-For / X-Real-IP chegam do nginx-proxy
        # e são repassados adiante automaticamente (não sobrescrever).
    }
}
