name: Deploy MCR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target VPS (all, cocari, cocamar)'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mcr-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./MCR.API
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-cocari:
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'cocari'
    steps:
      - name: Deploy to VPS Cocari
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_MCR_HOST }}
          username: root
          key: ${{ secrets.VPS_MCR_SSH_KEY }}
          script: |
            set -e
            cd /opt/mcr
            git pull origin main
            printf 'API_DOMAIN=mcr.cocari.txnenterprise.com.br\nLETSENCRYPT_EMAIL=%s\nDB_PASSWORD=%s\nJWT_SECRET=%s\nSKIP_MIGRATIONS=false\n' '${{ secrets.LETSENCRYPT_EMAIL }}' '${{ secrets.DB_PASSWORD }}' '${{ secrets.JWT_SECRET_COCARI }}' > .env
            mkdir -p nginx data/certs data/vhost.d data/html data/acme data/dataprotection-keys
            cp deploy/mcr-vps/nginx/custom.conf nginx/custom.conf
            if [ ! -f data/certs/${{ secrets.DOMAIN_COCARI }}.crt ]; then
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout data/certs/${{ secrets.DOMAIN_COCARI }}.key -out data/certs/${{ secrets.DOMAIN_COCARI }}.crt -subj /CN=${{ secrets.DOMAIN_COCARI }} 2>/dev/null
            fi
            docker compose down || true
            docker volume rm mcr_nginx_certs mcr_nginx_vhost mcr_nginx_html mcr_acme_data 2>/dev/null || true
            MCR_IMAGE=ghcr.io/${{ github.repository }}/mcr-api:latest docker compose up -d
            sleep 30
            DOMAIN=${{ secrets.DOMAIN_COCARI }}
            CERTS=data/certs/${DOMAIN}
            if [ -f "${CERTS}/fullchain.pem" ] && [ ! -L data/certs/${DOMAIN}.crt ]; then
              ln -sf ${DOMAIN}/fullchain.pem data/certs/${DOMAIN}.crt
              ln -sf ${DOMAIN}/key.pem data/certs/${DOMAIN}.key
              docker exec mcr-nginx nginx -s reload
            fi
            docker ps
            echo "Deploy Cocari concluido!"

  deploy-cocamar:
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'cocamar'
    steps:
      - name: Deploy to VPS Cocamar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_COCAMAR_HOST }}
          username: root
          key: ${{ secrets.VPS_COCAMAR_SSH_KEY }}
          script: |
            set -e
            cd /opt/mcr-cocamar
            git pull origin main
            printf 'API_DOMAIN=mcr.cocamar.txnenterprise.com.br\nLETSENCRYPT_EMAIL=%s\nDB_PASSWORD=%s\nJWT_SECRET=%s\nSKIP_MIGRATIONS=true\n' '${{ secrets.LETSENCRYPT_EMAIL }}' '${{ secrets.DB_PASSWORD }}' '${{ secrets.JWT_SECRET_COCAMAR }}' > .env
            mkdir -p nginx data/certs data/vhost.d data/html data/acme data/dataprotection-keys
            cp deploy/mcr-cocamar/nginx/custom.conf nginx/custom.conf
            if [ ! -f data/certs/${{ secrets.DOMAIN_COCAMAR }}.crt ]; then
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout data/certs/${{ secrets.DOMAIN_COCAMAR }}.key -out data/certs/${{ secrets.DOMAIN_COCAMAR }}.crt -subj /CN=${{ secrets.DOMAIN_COCAMAR }} 2>/dev/null
            fi
            docker compose down || true
            docker volume rm mcr_nginx_certs mcr_nginx_vhost mcr_nginx_html mcr_acme_data 2>/dev/null || true
            MCR_IMAGE=ghcr.io/${{ github.repository }}/mcr-api:latest docker compose up -d
            sleep 30
            DOMAIN=${{ secrets.DOMAIN_COCAMAR }}
            CERTS=data/certs/${DOMAIN}
            if [ -f "${CERTS}/fullchain.pem" ] && [ ! -L data/certs/${DOMAIN}.crt ]; then
              ln -sf ${DOMAIN}/fullchain.pem data/certs/${DOMAIN}.crt
              ln -sf ${DOMAIN}/key.pem data/certs/${DOMAIN}.key
              docker exec mcr-nginx nginx -s reload
            fi
            docker ps
            echo "Deploy Cocamar concluido!"
